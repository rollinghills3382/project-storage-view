name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are cancelled; every push to main gets a full run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.18+ runs the TypeScript frontend tests directly (type stripping).
          node-version: 22.x
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # tsc + vite build; also produces dist/, which the Tauri crate embeds at compile time.
      - run: npm run build

      # Rust unit tests (cargo test in src-tauri), then the node --test frontend tests.
      - run: npm test
